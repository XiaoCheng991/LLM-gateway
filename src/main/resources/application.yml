spring:
  application:
    name: llm-gateway
  thymeleaf:
    cache: false

# 模型相关配置
llm:
  default-context-window: 32000  # 上下文窗口阈值：ReAct 85% 预警与 ContextManager 70% 摘要共用的单一源头
  compact-secret: ${COMPACT_SECRET}  # /api/agent/compact 调用密钥
  sse-timeout: 300000  # 5分钟，毫秒
  agnes:
    api-key: ${AGNES_API_KEY}
    base-url: https://api.agnes-ai.cn/v1/chat/completions
  nvidia:
    api-key: ${NVIDIA_API_KEY}
    base-url: https://integrate.api.nvidia.com/v1/chat/completions
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: https://openrouter.ai/api/v1/chat/completions
  models:
    - model: openrouter/recursive/flint-v1.0:free
      provider: openrouter
      status: active
    - model: nvidia/minimaxai/minimax-m3.1-flash
      provider: nvidia
      status: active
    - model: nvidia/stepfun-ai/step-5-preview
      provider: nvidia
      status: active
    - model: nvidia/z-ai/glm-5.3-flash
      provider: nvidia
      status: active
    - model: agnes/agnes-3.0-flash
      provider: agnes
      status: active

# SQLite 和 限流 配置
agent:
  db:
    url: jdbc:sqlite:data/agent.db
  workspace-dir: ${WORKSPACE_DIR:data/workspace}
  rate-limit:
    openrouter:
      requests-per-minute: 100
    nvidia:
      requests-per-minute: 50
    agnes:
      requests-per-minute: 30

eval:
  max-retries: 2
  retry-base-ms: 15000