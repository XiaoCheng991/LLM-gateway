spring:
  application:
    name: llm-gateway
  thymeleaf:
    cache: false

# 模型相关配置
llm:
  sse-timeout: 300000  # 5分钟，毫秒
  agnes:
    api-key: ${AGNES_API_KEY}
    base-url: ${AGNES_BASE_URL}
  nvidia:
    api-key: ${NVIDIA_API_KEY}
    base-url: ${NVIDIA_BASE_URL}
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: ${OPENROUTER_BASE_URL}
  models:
    - model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      provider: openrouter
      status: active
    - model: nvidia/deepseek-ai/deepseek-v4.1-flash
      provider: nvidia
      status: active
    - model: nvidia/stepfun-ai/step-5-preview
      provider: nvidia
      status: active
    - model: nvidia/z-ai/glm-5.3-flash
      provider: nvidia
      status: active
    - model: agnes/agnes-3.0-flash
      provider: agnes
      status: active

# SQLite 和 限流 配置
agent:
  db:
    url: jdbc:sqlite:data/agent.db
  rate-limit:
    openrouter:
      requests-per-minute: 100
    nvidia:
      requests-per-minute: 50
    agnes:
      requests-per-minute: 30