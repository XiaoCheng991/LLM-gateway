spring:
  application:
    name: llm-gateway
  thymeleaf:
    cache: false

# 模型相关配置
llm:
  sse-timeout: 300000  # 5分钟，毫秒
  agnes:
    api-key: ${AGNES_API_KEY}
    base-url: https://apihub.agnes-ai.com/v1/chat/completions
  nvidia:
    api-key: ${NVIDIA_API_KEY}
    base-url: https://integrate.api.nvidia.com/v1/chat/completions
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: https://openrouter.ai/api/v1/chat/completions
  models:
    - model: openrouter/owl-alpha
      provider: openrouter
      status: active
    - model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      provider: openrouter
      status: active
    - model: nvidia/deepseek-ai/deepseek-v4-flash
      provider: nvidia
      status: active
    - model: nvidia/deepseek-ai/deepseek-v4-pro
      provider: nvidia
      status: active
    - model: nvidia/moonshot-ai/kimi-k2.6
      provider: nvidia
      status: active
    - model: agnes/agnes-2.0-flash
      provider: agnes
      status: active
    - model: agnes/agnes-image-2.1-flash
      provider: agnes
      status: active
    - model: agnes/agnes-video-v2.0
      provider: agnes
      status: active

# SQLite 和 限流 配置
agent:
  db:
    url: jdbc:sqlite:data/agent.db
  rate-limit:
    openrouter:
      requests-per-minute: 100
    nvidia:
      requests-per-minute: 50
    agnes:
      requests-per-minute: 30